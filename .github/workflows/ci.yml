name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate-build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate docs
        run: npm run validate:docs

      - name: Build Astro app
        run: npm run build

      - name: Build Docker image
        run: docker build -t ai-ready-astro-docs-template:ci .

  export-and-load-postgres:
    runs-on: ubuntu-latest
    needs: validate-build-docker
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docs
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docs -d docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://docs:docs@localhost:5432/docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export docs
        run: npm run export:docs

      - name: Load docs into PostgreSQL
        run: npm run load:docs:db
